<script id="graph-data" type="application/json">{"audit":{"excluded":["runtime behavior","builds"],"generated_at":"2026-07-23T01:11:52Z","id":"2026-07-23-011152-unity-verification","repository":"CrazyMarket","revision":"4532a1ee8cd8a5a6ed2a320e292bdb847c9848e2","scope":["Unity CLI and connected Editor diagnostics"],"title":"CrazyMarket Unity verification"},"edges":[{"confidence":"confirmed","evidence":[{"command":"unity --format json status"}],"finding_ids":[],"id":"v-cli-editor","kind":"calls","label":"connects","source":"unity-cli","status":"observed","summary":"CLI discovers and targets the ready CrazyMarket Editor.","target":"unity-editor","trace_ids":["V-CLI"]},{"confidence":"confirmed","evidence":[{"command":"unity --format json command recompile_status"}],"finding_ids":["V-F001"],"id":"v-editor-scripts","kind":"tests","label":"checks compilation","source":"unity-editor","status":"observed","summary":"Live recompile status reports up_to_date and failed false.","target":"project-scripts","trace_ids":["V-COMPILE"]},{"confidence":"confirmed","evidence":[{"command":"unity --format json command list_tests --mode all"}],"finding_ids":["V-F002"],"id":"v-editor-tests","kind":"tests","label":"discovers tests","source":"unity-editor","status":"observed","summary":"Live Test Framework discovery returns zero tests.","target":"unity-tests","trace_ids":["V-TESTS"]}],"nodes":[{"confidence":"confirmed","evidence":[{"command":"command -v unity && unity --version"}],"finding_ids":[],"id":"unity-cli","kind":"entry-point","label":"Unity CLI 1.0.0-beta.2","subsystem":"tooling","summary":"Official CLI resolved from the user Unity bin directory.","tags":["official"]},{"confidence":"confirmed","evidence":[{"command":"unity --format json status"}],"finding_ids":[],"id":"unity-editor","kind":"component","label":"CrazyMarket Editor 6000.4.1f1","subsystem":"editor","summary":"Connected ready Editor instance on Pipeline port 7800.","tags":["live-editor"]},{"confidence":"confirmed","eviden <script>
"use strict";
const data=JSON.parse(document.getElementById("graph-data").textContent),svg=document.getElementById("graph"),world=document.getElementById("world"),details=document.getElementById("details");
const NS="http://www.w3.org/2000/svg",byId=new Map(data.nodes.map(n=>[n.id,n]));let scale=1,tx=40,ty=40,drag=null,selected="",focusNode="";
document.getElementById("title").textContent=data.audit.title;
const uniq=(key)=>[...new Set(data.nodes.map(n=>n[key]).filter(Boolean))].sort();
function options(id,values,label=x=>x){const s=document.getElementById(id);values.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=label(v);s.append(o)})}
options("subsystem",uniq("subsystem"));options("kind",uniq("kind"));options("edge-kind",[...new Set(data.edges.map(e=>e.kind))].sort());options("confidence",uniq("confidence"));options("trace",data.traces.map(t=>t.id),id=>data.traces.find(t=>t.id===id).label);
const incoming=new Map(data.nodes.map(n=>[n.id,0]));data.edges.forEach(e=>incoming.set(e.target,(incoming.get(e.target)||0)+1));
const ranks=new Map(),queue=data.nodes.filter(n=>n.kind==="entry-point"||incoming.get(n.id)===0).sort((a,b)=>a.id.localeCompare(b.id));queue.forEach(n=>ranks.set(n.id,0));
while(queue.length){const n=queue.shift(),r=ranks.get(n.id);data.edges.filter(e=>e.source===n.id).sort((a,b)=>a.id.localeCompare(b.id)).forEach(e=>{if(!ranks.has(e.target)){ranks.set(e.target,r+1);queue.push(byId.get(e.target))}})}
let fallback=Math.max(0,...ranks.values())+1;data.nodes.filter(n=>!ranks.has(n.id)).sort((a,b)=>a.id.localeCompare(b.id)).forEach(n=>ranks.set(n.id,fallback));
const groups=new Map();data.nodes.forEach(n=>{const r=ranks.get(n.id);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(n)});groups.forEach(g=>g.sort((a,b)=>(a.subsystem+a.kind+a.id).localeCompare(b.subsystem+b.kind+b.id)));
const pos=new Map();groups.forEach((group,r)=>group.forEach((n,i)=>pos.set(n.id,{x:r*250,y:i*100})));
function el(name,attrs={}){const x=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));return x}
const edgeEls=new Map(),nodeEls=new Map();
data.edges.forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target),p=el("path",{d:`M ${a.x+180} ${a.y+30} C ${a.x+215} ${a.y+30}, ${b.x-35} ${b.y+30}, ${b.x} ${b.y+30}`,class:`edge ${e.status}`,tabindex:"0","data-id":e.id});p.addEventListener("click",()=>show(e,"Connection"));p.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" ")show(e,"Connection")});world.append(p);edgeEls.set(e.id,p)});
data.nodes.forEach(n=>{const p=pos.get(n.id),g=el("g",{class:`node ${n.kind}`,transform:`translate(${p.x} ${p.y})`,tabindex:"0","data-id":n.id,role:"button"}),r=el("rect",{width:"180",height:"60",rx:"7"}),t=el("text",{x:"10",y:"25"}),s=el("text",{x:"10",y:"44",class:"muted"});t.textContent=n.label.length>24?n.label.slice(0,23)+"…":n.label;s.textContent=n.subsystem;g.append(r,t,s);g.addEventListener("click",()=>show(n,"Component"));g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" ")show(n,"Component")});world.append(g);nodeEls.set(n.id,g)});
function text(tag,value,cls){const x=document.createElement(tag);if(cls)x.className=cls;x.textContent=value;return x}
function show(item,type){selected=item.id;location.hash=encodeURIComponent(item.id);details.replaceChildren(text("h2",item.label||item.id),text("p",`${type} · ${item.kind} · ${item.confidence||item.status}`,"muted"),text("p",item.summary));if(byId.has(item.id)){const b=document.createElement("button");b.textContent="Focus neighbors";b.addEventListener("click",()=>{focusNode=focusNode===item.id?"":item.id;b.textContent=focusNode?"Show all":"Focus neighbors";apply()});details.append(b)};(item.evidence||[]).forEach(ev=>{const d=document.createElement("div");d.className="evidence";const label=[ev.path,ev.line&&`:${ev.line}`,ev.symbol&&` · ${ev.symbol}`,ev.command,ev.commit,ev.url].filter(Boolean).join("");if(ev.path){const a=document.createElement("a");a.href=`../../../${ev.path}${ev.line?`#L${ev.line}`:""}`;a.textContent=label;d.append(a)}else d.textContent=label;details.append(d)});apply()}
function apply(){const q=document.getElementById("search").value.toLowerCase(),sub=document.getElementById("subsystem").value,kind=document.getElementById("kind").value,edgeKind=document.getElementById("edge-kind").value,conf=document.getElementById("confidence").value,trace=document.getElementById("trace").value,t=data.traces.find(x=>x.id===trace),active=new Set(t?t.ordered_edges:[]),activeNodes=new Set(),neighbors=new Set([focusNode]);active.forEach(id=>{const e=data.edges.find(x=>x.id===id);if(e){activeNodes.add(e.source);activeNodes.add(e.target)}});if(focusNode)data.edges.forEach(e=>{if(e.source===focusNode)neighbors.add(e.target);if(e.target===focusNode)neighbors.add(e.source)});data.nodes.forEach(n=>{const hay=JSON.stringify(n).toLowerCase(),visible=(!q||hay.includes(q))&&(!sub||n.subsystem===sub)&&(!kind||n.kind===kind)&&(!conf||n.confidence===conf)&&(!trace||activeNodes.has(n.id))&&(!focusNode||neighbors.has(n.id));nodeEls.get(n.id).classList.toggle("dim",!visible);nodeEls.get(n.id).classList.toggle("selected",selected===n.id)});data.edges.forEach(e=>{const endpoints=!nodeEls.get(e.source).classList.contains("dim")&&!nodeEls.get(e.target).classList.contains("dim"),visible=endpoints&&(!trace||active.has(e.id))&&(!edgeKind||e.kind===edgeKind);edgeEls.get(e.id).classList.toggle("dim",!visible);edgeEls.get(e.id).classList.toggle("active",active.has(e.id)||selected===e.id)})}
["search","subsystem","kind","edge-kind","confidence","trace"].forEach(id=>document.getElementById(id).addEventListener("input",apply));
function transform(){world.setAttribute("transform",`translate(${tx} ${ty}) scale(${scale})`)}function fit(){const box=world.getBBox(),v=svg.getBoundingClientRect();scale=Math.min((v.width-50)/Math.max(box.width,1),(v.height-50)/Math.max(box.height,1),1.4);tx=(v.width-box.width*scale)/2-box.x*scale;ty=(v.height-box.height*scale)/2-box.y*scale;transform()}
svg.addEventListener("wheel",e=>{e.preventDefault();scale=Math.max(.15,Math.min(3,scale*(e.deltaY>0?.9:1.1)));transform()},{passive:false});svg.addEventListener("pointerdown",e=>{if(e.target.closest(".node,.edge"))return;drag={x:e.clientX-tx,y:e.clientY-ty};svg.setPointerCapture(e.pointerId)});svg.addEventListener("pointermove",e=>{if(drag){tx=e.clientX-drag.x;ty=e.clientY-drag.y;transform()}});svg.addEventListener("pointerup",()=>drag=null);
document.getElementById("fit").addEventListener("click",fit);document.getElementById("reset").addEventListener("click",()=>{document.querySelectorAll("input,select").forEach(x=>x.value="");selected="";focusNode="";location.hash="";apply();fit()});window.addEventListener("resize",fit);transform();requestAnimationFrame(fit);
</script>
